<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warehouse — unit tests</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <style>
    body { padding: 20px; }
    .t-pass { color: var(--c-ok); }
    .t-fail { color: var(--c-err); font-weight: 700; }
    pre { background: var(--c-surface); border: 1px solid var(--c-border); padding: 12px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Pure-utility unit tests</h1>
  <p class="muted">Open this file via <span class="mono">http://localhost:8000/warehouse/tests.html</span>. No backend needed.</p>
  <pre id="out">running…</pre>

  <script type="module">
    import { escapeHtml } from "./js/util/dom.js";
    import { todayISO, addDaysISO, isOverdue, daysBetween, fmtDate } from "./js/util/dates.js";
    import { toCSV } from "./js/util/export.js";

    const results = [];
    let pass = 0, fail = 0;
    function ok(cond, msg) {
      results.push((cond ? "  ok   " : " FAIL  ") + msg);
      cond ? pass++ : fail++;
    }
    function eq(a, b, msg) { ok(JSON.stringify(a) === JSON.stringify(b), `${msg}  (got ${JSON.stringify(a)})`); }

    // escapeHtml
    eq(escapeHtml('<script>"x"'), "&lt;script&gt;&quot;x&quot;", "escapeHtml escapes tags & quotes");
    eq(escapeHtml(null), "", "escapeHtml(null) -> ''");
    eq(escapeHtml("a & b"), "a &amp; b", "escapeHtml ampersand");

    // dates
    eq(addDaysISO("2026-01-01", 31), "2026-02-01", "addDaysISO crosses month");
    eq(addDaysISO("2026-03-01", -1), "2026-02-28", "addDaysISO negative");
    eq(daysBetween("2026-01-01", "2026-01-15"), 14, "daysBetween");
    ok(/^\d{4}-\d{2}-\d{2}$/.test(todayISO()), "todayISO format");
    ok(isOverdue("2000-01-01", 0) === true, "isOverdue past date");
    ok(isOverdue("2999-01-01", 0) === false, "isOverdue future date");
    ok(isOverdue("", 0) === false, "isOverdue empty -> false");
    ok(fmtDate("2026-09-01").length > 0, "fmtDate renders");

    // CSV
    const csv = toCSV(["a", "b"], [{ a: "x,y", b: 'he said "hi"' }, { a: "1", b: "2" }]);
    ok(csv.startsWith("﻿"), "CSV has UTF-8 BOM");
    ok(csv.includes('"x,y"'), "CSV quotes comma values");
    ok(csv.includes('"he said ""hi"""'), "CSV escapes double quotes");

    const summary = fail ? `\n${fail} FAILED, ${pass} passed` : `\nALL ${pass} PASSED`;
    document.getElementById("out").textContent = results.join("\n") + "\n" + summary;
    document.getElementById("out").className = fail ? "t-fail" : "t-pass";
  </script>
</body>
</html>
