name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JavaScript syntax (frontend)
        run: |
          find warehouse/js warehouse/config.js index.html -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: JavaScript syntax (Apps Script .gs)
        run: |
          set -e
          mkdir -p .gscheck
          for f in warehouse/apps-script/*.gs; do
            cp "$f" ".gscheck/$(basename "${f%.gs}").js"
          done
          for f in .gscheck/*.js; do node --check "$f"; done

      - name: Python syntax (mock backend)
        run: python3 -m py_compile warehouse/mock-server/server.py

      - name: JSON validity
        run: |
          python3 -c "import json,glob,sys; [json.load(open(f)) for f in ['warehouse/apps-script/appsscript.json','warehouse/mock-server/mock-db.seed.json']]; print('json ok')"

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pure-utility tests
        run: node .ci/run-util-tests.mjs
